[project]
name = "returns-orchestrator"
version = "0.1.0"
description = "Policy-driven returns orchestration service for retail"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "openai>=1.40",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pandas>=2.0",
]
trace = [
    "langsmith>=0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
