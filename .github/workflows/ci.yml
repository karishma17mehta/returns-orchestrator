name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_board_sweep:
        description: "Run the paid LLM board sweep (uses OPENAI_API_KEY)"
        type: boolean
        default: false
      board_sample:
        description: "Board sweep sample size"
        default: "50"

jobs:
  # Always-on, offline, deterministic: unit tests + the rule-engine
  # regression gate. No API key required.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Rule-engine regression gate
        run: |
          python scripts/eval_triage.py \
            --min-accuracy 0.85 \
            --max-false-approvals 0 \
            --max-false-rejections 0

  # Costs money (real LLM calls), so it NEVER runs automatically. Trigger it
  # deliberately: Actions tab -> CI -> "Run workflow" -> tick "Run the paid
  # LLM board sweep". Push/PR events skip this job entirely.
  board-sweep:
    runs-on: ubuntu-latest
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_board_sweep == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Board sweep regression gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret not set — skipping board sweep."
            exit 0
          fi
          # Post-hardening sweeps showed 0 ineligible auto-approvals across
          # 130 sampled cases (30 + 100), so 0 is the evidence-backed gate;
          # the pre-fix regression was ~10% (3/30), which trips it loudly.
          python scripts/eval_triage.py --board \
            --sample "${{ github.event.inputs.board_sample || '50' }}" \
            --threshold 0.75 \
            --max-board-false-approvals 0
